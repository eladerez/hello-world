<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ML Q&amp;A</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="nav-controls">
    <button id="backBtn" class="nav-btn" aria-label="Back" disabled>&larr;</button>
    <button id="forwardBtn" class="nav-btn" aria-label="Forward" disabled>&rarr;</button>
  </div>
  <button id="homeBtn" class="brand">ML Q&amp;A</button>
</header>

<main class="app" id="app"></main>

<div id="tooltip" class="tooltip" role="tooltip" hidden></div>

<div id="selectionActions" class="selection-actions" hidden>
  <button id="explainSelectionBtn" type="button" class="explain-btn">+ Explain</button>
</div>

<div id="annotationOverlay" class="annotation-overlay" hidden>
  <div class="card annotation-dialog">
    <p class="eyebrow">Explain this text</p>
    <p class="annotation-selected-text" id="annotationSelectedText"></p>
    <div class="form-field">
      <label for="annotationExplanationText">Explanation</label>
      <textarea id="annotationExplanationText" rows="5" placeholder="Explain this part in more detail..."></textarea>
    </div>
    <div class="form-actions">
      <button class="reveal-btn" id="saveAnnotationBtn" type="button">Save explanation</button>
      <button class="cancel-btn" id="cancelAnnotationBtn" type="button">Cancel</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
